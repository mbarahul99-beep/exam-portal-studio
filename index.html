<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APEX" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#065f46" />
    <link rel="manifest" id="app-manifest-link" href="/manifest.json" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      const manifestLink = document.getElementById('app-manifest-link');
      if (manifestLink && (window.location.search.includes('app=student') || localStorage.getItem('apex_pwa_mode') === 'student')) {
        manifestLink.setAttribute('href', '/student-manifest.json');
      }

      // Capture native PWA install prompt globally on startup
      window.deferredAppInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredAppInstallPrompt = e;
        // Dispatch custom event to notify mounted components
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });
    </script>
    <title>APEX - OMR & Online Exam Portal</title>
    <!-- Preconnect & Preload proven working OpenCV.js engine -->
    <link rel="preconnect" href="https://docs.opencv.org" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" id="opencv-script"></script>
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preload" as="image" href="/logo_name.png" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: #f0f4f8; font-family: system-ui, -apple-system, sans-serif;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; animation: pulse 1.5s ease-in-out infinite;">
          <img src="/logo.png" alt="Logo" style="height: 42px; width: auto; object-fit: contain;" />
          <img src="/logo_name.png" alt="Institute APEX" style="height: 38px; width: auto; object-fit: contain;" />
        </div>
        <div style="width: 32px; height: 32px; border: 3px solid #cbd5e1; border-top-color: #0d9488; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
          @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
